<style>
.reward-page {
  --reward-bg: hsl(22 18% 11%);
  --reward-shell: hsl(22 22% 6%);
  --reward-alert: hsl(20 30% 10%);
  --reward-panel: hsl(24 24% 8%);
  --reward-step: hsl(28 27% 11%);
  --reward-chip: hsl(28 25% 12%);
  --reward-muted: hsl(32 18% 76%);
  --reward-subtle: hsl(30 12% 63%);
  --reward-teal: hsl(37 88% 70%);
  --reward-border: hsl(30 40% 27%);
  --reward-border-strong: hsl(31 52% 36%);
  --reward-footer: hsl(22 22% 5%);
  --reward-urgent: hsl(32 100% 62%);
  --reward-urgent-soft: hsl(25 48% 13%);

  <body>
    <div id="root"></div>

  <script>
/* Bueno offer settings: edit this value if the hoodie destination changes. */
window.BUENO_OFFER_URL = "https://buenohoodies.com/c/PrescReco";
(function () {
  document.addEventListener("click", function (event) {
    var button = event.target.closest(".reward-claim");
    if (!button) return;
    event.preventDefault();
    event.stopImmediatePropagation();

    // Read campid at click time, pass it through unchanged, and forward no other query parameters.
    var params = new URLSearchParams(window.location.search);
    var campid = params.get("campid") || "";
    var href = window.BUENO_OFFER_URL + "?campid=" + encodeURIComponent(campid);

    // Fire the TikTok click event before navigating so the existing pixel can record the CTA.
    if (window.ttq && typeof window.ttq.track === "function") {
      window.ttq.track("ClickButton");
    }
    window.setTimeout(function () {
      window.location.href = href;
    }, 500);
  }, true);
})();
</script>
