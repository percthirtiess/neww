<script>
window.SCR = (function () {
  'use strict';
  var C = window.SCR_CONFIG || {};

  var HOSTS = [
    ['threads',   /Barcelona/i],
    ['instagram', /Instagram/i],
    ['tiktok',    /BytedanceWebview|musical_ly|TikTok/i],
    ['facebook',  /FBAN|FBAV|FB_IAB|FB4A|FBLC/i],
    ['snapchat',  /Snapchat/i],
    ['linkedin',  /LinkedInApp/i],
    ['twitter',   /Twitter/i],
    ['pinterest', /Pinterest/i]
  ];

  function host() {
    var ua = navigator.userAgent;
    for (var i = 0; i < HOSTS.length; i++) if (HOSTS[i][1].test(ua)) return HOSTS[i][0];
    if (window.webkit && window.webkit.messageHandlers) return 'unknown-ios';
    return null;
  }

  function target(url) {
    var ua = navigator.userAgent;
    if (/Android/i.test(ua)) {
      return 'intent://' + url.replace(/^https?:\/\//, '') +
        '#Intent;scheme=https;action=android.intent.action.VIEW;' +
        'category=android.intent.category.BROWSABLE;' +
        'S.browser_fallback_url=' + encodeURIComponent(url) + ';end';
    }
    if (/iPhone|iPad|iPod/i.test(ua)) return url.replace(/^https?:\/\//, 'x-safari-https://');
    return url;
  }

  function esc(s) { return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;'); }

  function injectOnLoad() {
    var url = C.offerUrl;
    if (!url || !host()) return false;
    try { if (sessionStorage.getItem('scr_esc')) return false; } catch (e) {}
    try { sessionStorage.setItem('scr_esc', '1'); } catch (e) {}
    document.write('<meta http-equiv="refresh" content="0.25;url=' + esc(target(url)) + '">');
    return true;
  }

  function fire() {
    var url = C.offerUrl;
    if (!url) return false;
    location.href = target(url);
    return true;
  }

  function guard(onFail) {
    var alive = true, drifted = false, last = Date.now();
    function kill() { alive = false; }
    document.addEventListener('visibilitychange', function () { if (document.hidden) kill(); });
    window.addEventListener('pagehide', kill);
    window.addEventListener('blur', kill);
    var iv = setInterval(function () {
      var now = Date.now();
      if (now - last > 900) drifted = true;
      last = now;
    }, 250);
    setTimeout(function () {
      clearInterval(iv);
      if (!alive || drifted || document.hidden) return;
      onFail && onFail();
    }, C.graceMs || 1400);
  }

  return { host: host, target: target, injectOnLoad: injectOnLoad, fire: fire, guard: guard };
})();
SCR.injectOnLoad();
</script>

</div>
<script>
(function () {
  var go = document.getElementById('go'), here = document.getElementById('here');
  function run() {
    if (!SCR.host()) { location.href = window.SCR_CONFIG.offerUrl; return; }
    SCR.fire();
    SCR.guard(function () {
      go.textContent = 'Tap again to open browser';
      here.style.display = 'block';
    });
  }
  go.addEventListener('click', run);
  here.addEventListener('click', function () { location.href = window.SCR_CONFIG.offerUrl; });
  if (!SCR.host()) setTimeout(run, 300);
  else SCR.guard(function () { here.style.display = 'block'; });
})();
</script>
